---
- name: Default route via OPNsense (replaces the Vagrant NAT route)
  ansible.builtin.command: ip route replace default via {{ lan_gw }} dev {{ lan_iface }}
  changed_when: false

- name: Keep the route after a reboot (netplan drop-in, not applied now)
  ansible.builtin.copy:
    dest: /etc/netplan/99-default-route.yaml
    mode: "0600"
    content: |
      network:
        version: 2
        ethernets:
          {{ lan_iface }}:
            routes:
              - to: default
                via: {{ lan_gw }}
                metric: 10

- name: apt always uses IPv4
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/99force-ipv4
    content: 'Acquire::ForceIPv4 "true";'
    mode: "0644"

- name: "Check 1/3: OPNsense answers ping"
  ansible.builtin.command: ping -c 2 -W 2 {{ lan_gw }}
  changed_when: false

- name: "Check 2/3: DNS resolves archive.ubuntu.com"
  ansible.builtin.command: getent ahostsv4 archive.ubuntu.com
  changed_when: false

- name: "Check 3/3: HTTP to the Internet through OPNsense"
  ansible.builtin.uri:
    url: http://archive.ubuntu.com
    method: HEAD
    follow_redirects: none
    timeout: 10
    status_code: [200, 301, 302]

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
