[db]
sitea-mysql          ansible_port=2201 ansible_ssh_private_key_file=.vagrant/machines/sitea-mysql/virtualbox/private_key

[web]
sitea-web            ansible_port=2202 ansible_ssh_private_key_file=.vagrant/machines/sitea-web/virtualbox/private_key

[ha]
sitea-haproxy-backup ansible_port=2203 ansible_ssh_private_key_file=.vagrant/machines/sitea-haproxy-backup/virtualbox/private_key vrrp_state=BACKUP vrrp_prio=100 router_id=SITEA_HAPROXY_BACKUP
sitea-haproxy-master ansible_port=2204 ansible_ssh_private_key_file=.vagrant/machines/sitea-haproxy-master/virtualbox/private_key vrrp_state=MASTER vrrp_prio=110 router_id=SITEA_HAPROXY_MASTER

[all:vars]
ansible_host=127.0.0.1
ansible_user=vagrant
ansible_ssh_common_args=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
