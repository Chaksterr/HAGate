global
    log /dev/log local0
    maxconn 2000
    user haproxy
    group haproxy
    daemon

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend http_in
    bind 10.0.2.100:80
    default_backend web_servers

backend web_servers
    balance roundrobin
    option httpchk GET /
    server web1 10.0.2.7:80 check
