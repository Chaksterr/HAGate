global_defs {
    router_id SITEA_HAPROXY_MASTER
    enable_script_security
    script_user root
}

vrrp_script chk_haproxy {
    script "/usr/bin/pgrep haproxy"
    interval 2
    weight -20
}

vrrp_instance VI_1 {
    state MASTER
    interface enp0s8
    virtual_router_id 51
    priority 110
    advert_int 1
    unicast_src_ip 10.0.2.5
    unicast_peer {
        10.0.2.6
    }
    authentication {
        auth_type PASS
        auth_pass Secret12
    }
    virtual_ipaddress {
        10.0.2.100/24 dev enp0s8
    }
    track_script {
        chk_haproxy
    }
}
