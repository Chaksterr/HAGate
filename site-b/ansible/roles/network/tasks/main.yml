---
# Site B deviation from site-a: the Vagrantfile creates the LAN nic with
# auto_config:false (it must not overwrite the runbook's netplan), so the
# address has to be written here. site-a can skip this — Vagrant configures
# their nic for them.

- name: Write the lab netplan (NAT nic + static LAN address)
  ansible.builtin.template:
    src: 01-lab.yaml.j2
    dest: /etc/netplan/01-lab.yaml
    mode: "0600"
  register: netplan_file

- name: Drop the netplan files left by the manual blocks (if any)
  ansible.builtin.file:
    path: /etc/netplan/{{ item }}
    state: absent
  loop:
    - 50-cloud-init.yaml
    - 99-default-route.yaml

- name: Bring the LAN interface up
  ansible.builtin.command: ip link set {{ lan_iface }} up
  changed_when: false

- name: Apply netplan
  ansible.builtin.command: netplan apply
  changed_when: netplan_file.changed

- name: Default route via OPNsense (belt and braces on first run)
  ansible.builtin.command: ip route replace default via {{ lan_gw }} dev {{ lan_iface }}
  changed_when: false
  when: netplan_file.changed

- name: "Check 1/3: OPNsense answers ping"
  ansible.builtin.command: ping -c 2 -W 2 {{ lan_gw }}
  changed_when: false
  register: gw_ping
  retries: 5
  delay: 3
  until: gw_ping.rc == 0

- name: apt always uses IPv4
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/99force-ipv4
    content: 'Acquire::ForceIPv4 "true";'
    mode: "0644"

- name: "Check 2/3: DNS resolves archive.ubuntu.com"
  ansible.builtin.command: getent ahostsv4 archive.ubuntu.com
  changed_when: false

- name: "Check 3/3: HTTP to the Internet through OPNsense"
  ansible.builtin.uri:
    url: http://archive.ubuntu.com
    method: HEAD
    follow_redirects: none
    timeout: 10
    status_code: [200, 301, 302]

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
