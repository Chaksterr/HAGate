# Site B inventory.
# The VMs are created by ../../../vagrant/Vagrantfile (folder `infra/vagrant`),
# which does NOT pin forwarded ports: every VM gets the next free host port
# (2200, 2201, ...). Values below are the ones currently configured — verify
# with:  cd ../../../vagrant && vagrant ssh-config <vm> | grep Port
#
# Keys are Vagrant's per-machine private keys (regenerated if the VM is
# destroyed and recreated -> update the paths then).

[db]
siteb-mysql lan_ip=10.15.15.8 ansible_port=2222 ansible_ssh_private_key_file=/home/jmal/Desktop/infra/vagrant/.vagrant/machines/siteb-mysql/virtualbox/private_key

[web]
siteb-web lan_ip=10.15.15.7 ansible_port=2201 ansible_ssh_private_key_file=/home/jmal/Desktop/infra/vagrant/.vagrant/machines/siteb-web/virtualbox/private_key

[ha]
siteb-haproxy-backup lan_ip=10.15.15.11 ansible_port=2203 ansible_ssh_private_key_file=/home/jmal/Desktop/infra/vagrant/.vagrant/machines/siteb-haproxy-backup/virtualbox/private_key vrrp_state=BACKUP vrrp_prio=100 router_id=SITEB_HAPROXY_BACKUP
siteb-haproxy-master lan_ip=10.15.15.10 ansible_port=2202 ansible_ssh_private_key_file=/home/jmal/Desktop/infra/vagrant/.vagrant/machines/siteb-haproxy-master/virtualbox/private_key vrrp_state=MASTER vrrp_prio=150 router_id=SITEB_HAPROXY_MASTER

[all:vars]
ansible_host=127.0.0.1
ansible_user=vagrant
ansible_ssh_common_args=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
